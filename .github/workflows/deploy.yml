# GitHub Pages 자동 배포 워크플로 — 실제로 도는 파일.
#
# 이 파일이 원본이고, `docs/deploy.workflow.yml`이 문서용 사본이다. 둘은 같은
# 내용을 유지한다. `.github/workflows/` 경로는 workflows 스코프가 없는 푸시를
# GitHub이 거부하므로 수정은 웹 에디터로 한다.
#
# Settings → Pages → Source: GitHub Actions 로 한 번 지정한 뒤,
# main에 푸시할 때마다 테스트·빌드·배포가 돈다.
#
# 액션은 모두 Node 24 런타임을 쓰는 메이저로 고정한다(2025-09 Node 20 deprecation).
# 빌드 노드 버전은 ci.yml과 같게 22를 쓴다.
#
# 빌드 단계의 VITE_BASE_PATH가 이 리포의 Pages 경로(/damon-chat-desk/)를
# vite base로 넘긴다 — 없으면 asset이 /assets/로 나가 404가 된다.
name: Deploy to GitHub Pages

on:
  push:
    branches: [main]
  workflow_dispatch:

permissions:
  contents: read
  pages: write
  id-token: write

concurrency:
  group: pages
  cancel-in-progress: true

jobs:
  build:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v7

      - uses: actions/setup-node@v7
        with:
          node-version: 22
          cache: npm

      - name: Install
        run: npm ci

      - name: Test
        run: npm test

      - name: Build
        env:
          VITE_BASE_PATH: /damon-chat-desk/
        run: npm run build

      - uses: actions/configure-pages@v6

      - uses: actions/upload-pages-artifact@v5
        with:
          path: dist

  deploy:
    needs: build
    runs-on: ubuntu-latest
    environment:
      name: github-pages
      url: ${{ steps.deployment.outputs.page_url }}
    steps:
      - id: deployment
        uses: actions/deploy-pages@v5
