# 테스트 CI 워크플로 — 참고용 사본.
#
# 실제로 도는 파일은 `.github/workflows/ci.yml`이다(활성 상태, Actions 탭의 `ci`).
# PR·main 푸시·수동 실행에서 typecheck·테스트·빌드를 돌려 머지 전에 빨간불을 본다.
# 이 사본은 문서에서 바로 읽어 보라고 둔 것이며 복사해서 쓰는 파일이 아니다 —
# 고칠 때는 두 파일을 같이 고친다. `.github/workflows/` 경로는 workflows 스코프가
# 없으면 푸시가 거부되므로 수정은 웹 에디터로 한다. docs/ci-setup.md 참고.
#
# 무엇을 보는가:
#   typecheck  npx tsc --noEmit          — 앱과 테스트의 타입
#   test       npm test                  — vitest (전 시나리오)
#   build      npm run build             — 기본 base(/)
#   build:pages VITE_BASE_PATH=…         — GitHub Pages 프로젝트 페이지 빌드
#
# 배포(deploy.yml)는 main 푸시에서 같은 검사를 다시 돈다. 이 워크플로는
# PR에서 먼저 막는 용도다 — 머지 전에 빨간불을 보기 위한 것.
# 액션은 모두 Node 24 런타임을 쓰는 메이저로 고정한다(2025-09 Node 20 deprecation).
name: ci

on:
  push:
    branches: [main]
  pull_request:
  workflow_dispatch:

permissions:
  contents: read

concurrency:
  group: ci-${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: true

jobs:
  test:
    name: typecheck · test · build
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v7

      - uses: actions/setup-node@v7
        with:
          node-version: 22
          cache: npm

      - name: Install
        run: npm ci

      - name: Typecheck
        run: npx tsc --noEmit

      - name: Test
        run: npm test

      - name: Build
        run: npm run build

      # Pages는 프로젝트 페이지(/damon-chat-desk/)에서 서빙된다. base가
      # 빠지면 asset이 /assets/…로 나가 404가 되므로 배포와 같은 값으로
      # 한 번 더 빌드해 본다.
      - name: Build (GitHub Pages base)
        env:
          VITE_BASE_PATH: /damon-chat-desk/
        run: npm run build
